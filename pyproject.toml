[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fmf-jinja"
authors = [
    { name = "Cristian Le", email = "git@lecris.dev" },
]
maintainers = [
    { name = "Cristian Le", email = "git@lecris.dev" },
]
description = "Jinja-style templater using fmf metadata"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSES/GPL-3.0-or-later.txt"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Utilities",
]
keywords = [
    "metadata",
    "template",
]
dependencies = [
    "fmf",
    "attrs>=23.2.0",  # cached_property is broken otherwise
    "cattrs",
    "Jinja2",
    "click",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/LecrisUT/fmf-jinja"

[dependency-groups]
test = [
    "pytest",
]
test-cov = [
    {include-group = "test"},
    "pytest-cov",
]
docs = [
    "sphinx",
    "furo",
    "myst-parser",
    "sphinx-tippy",
    "sphinx-click",
]
dev = [
    {include-group = "test-cov"},
    {include-group = "docs"},
]

[project.scripts]
fmf-jinja = "fmf_jinja.cli:main"

[tool.hatch]
version.source = "vcs"
version.raw-options.version_scheme = "post-release"
build.hooks.vcs.version-file = "src/fmf_jinja/_version.py"
metadata.allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "smoke: Simple smoke tests",
    "functional: Functional/Regeression tests",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "CPY001",    # Missing copyright notice at top of file
    "D203",    # 1 blank line required before class docstring
    "D212",    # Multi-line docstring summary should start at the first line
    "FIX002",    # Line contains TODO
    "S101",    # Use of assert detected
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link on the line following this TODO
    "D200",    # One-line docstring should fit on one line
    "TID252",  # Prefer absolute imports over relative imports from parent modules
]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["D", "ANN", "INP001"]
"docs/**" = ["INP001"]
"docs/conf.py" = ["D100"]

[tool.mypy]
files = ["src", "test"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src"]
python_version = "3.12"
warn_unused_configs = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
strict = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["fmf_jinja.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["fmf.*"]
ignore_missing_imports = true
