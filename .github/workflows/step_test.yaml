on:
  workflow_call:
    inputs:
      mask-experimental:
        type: boolean
        default: true
        description: Always report experimental test as successful

permissions:
  contents: read

jobs:
  checks:
    name: >
      🐍 ${{ matrix.python-version }}
      🌳 ${{ matrix.tmt-version || 'latest' }}
      ⛩️ ${{ matrix.jinja-version || 'latest' }}
      ${{ matrix.experimental && '[🧪 Experimental]' || '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.x" ]
        tmt-version: [ "" ]
        jinja-version: [ "" ]
        include:
          - python-version: "3.x"
            jinja-version: "main"
            tmt-version: "main"
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
      - name: Install the project
        run: uv sync --frozen --group test
      - name: Install fmf ${{ matrix.tmt-version }}
        run: uv pip install fmf@git+https://github.com/teemtee/fmf@${{ matrix.tmt-version }}
        if: matrix.tmt-version
      - name: Install jinja ${{ matrix.jinja-version }}
        run: uv pip install jinja2@git+https://github.com/pallets/jinja/@${{ matrix.tmt-version }}
        if: matrix.jinja-version
      - name: Test package
        run: pytest
        continue-on-error: ${{ matrix.experimental && inputs.mask-experimental}}
